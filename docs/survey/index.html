const STEPS = ['intro','panas','dec1','dec2','dec3','final','thanks'];
const TOTAL = 6; // intro不计入进度

// ===== 状态管理 =====
const STORAGE_KEY = 'survey_state';
let state = loadState();
const t = TEXT[lang];

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (s.step && STEPS.includes(s.step)) return s;
  } catch {}
  return { step: 'intro', consent: false, panas: {}, decisions: {}, openText: '', mathAnswer: '', demo: {} };
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

// ===== 渲染 =====
const app = document.getElementById('survey-app');

function render() {
  saveState();
  switch(state.step) {
    case 'intro': renderIntro(); break;
    case 'panas': renderPanas(); break;
    case 'dec1': renderDecisions(0, 4); break;
    case 'dec2': renderDecisions(4, 8); break;
    case 'dec3': renderDecisions(8, 13); break;
    case 'final': renderFinal(); break;
    case 'thanks': renderThanks(); break;
  }
}

function wrap(html) {
  return `<div class="survey-wrapper">${progressHTML()}${html}${navHTML()}</div>`;
}

function progressHTML() {
  if (state.step === 'intro' || state.step === 'thanks') return '';
  const idx = STEPS.indexOf(state.step);
  const p = Math.min(Math.max((idx - 1) / (TOTAL - 1), 0), 1);
  const label = t.progress.replace('{c}', Math.min(idx, TOTAL)).replace('{t}', TOTAL);
  return `<div class="survey-progress"><span>${label}</span><div class="survey-progress-bar"><div class="survey-progress-fill" style="width:${p*100}%"></div></div></div>`;
}

function navHTML() {
  if (state.step === 'intro' || state.step === 'thanks') return '';
  let html = '<div class="survey-nav">';
  if (state.step !== 'panas') html += `<button class="survey-btn survey-btn-ghost" id="btn-prev">${t.prev}</button>`;
  else html += '<div></div>';
  if (state.step === 'final') html += `<button class="survey-btn survey-btn-primary" id="btn-next">${t.submit}</button>`;
  else html += `<button class="survey-btn survey-btn-primary" id="btn-next">${t.next}</button>`;
  html += '</div><div class="survey-error" id="survey-error">' + t.required + '</div>';
  return html;
}

// Step: Intro
function renderIntro() {
  app.innerHTML = wrap(`
    <div class="survey-step active">
      <h1 class="survey-h1">${t.title}</h1>
      ${t.intro.map(p => `<p class="survey-p">${p}</p>`).join('')}
      <label class="survey-checkbox ${state.consent?'checked':''}" id="consent-label" style="margin-top:24px;">
        <input type="checkbox" id="consent-check" ${state.consent?'checked':''}>
        <span>${t.agree}</span>
      </label>
      <div style="margin-top:24px;text-align:center;">
        <button class="survey-btn survey-btn-primary" id="btn-start" ${state.consent?'':'disabled'}>${t.start}</button>
      </div>
    </div>
  `);
  document.getElementById('consent-label').onclick = () => {
    state.consent = !state.consent;
    document.getElementById('consent-check').checked = state.consent;
    document.getElementById('consent-label').classList.toggle('checked', state.consent);
    document.getElementById('btn-start').disabled = !state.consent;
    saveState();
  };

  }

  function showLoading(show) {
    const existing = document.querySelector('.chat-message.typing');
    if (show && !existing) {
      const msg = document.createElement('div');
      msg.className = 'chat-message bot typing';
      msg.innerHTML = `
        <div class="message-avatar">🦞</div>
        <div class="message-bubble">
          <div class="typing-indicator"><span></span><span></span><span></span></div>
        </div>
      `;
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    } else if (!show && existing) {
      existing.remove();
    }
  }

  function setStatus(text, loading = false) {
    chatStatus.textContent = text;
    chatStatus.classList.toggle('loading', loading);
  }

  async function sendMessage() {
    const text = chatInput.value.trim();
    if (!text || isLoading) return;

    chatInput.value = '';
    chatInput.style.height = 'auto';
    chatSendBtn.disabled = true;

    addMessage('user', text);
    messageHistory.push({ role: 'user', content: text });

    isLoading = true;
    showLoading(true);
    setStatus(texts.thinking, true);

    try {
      const response = await fetch(CHAT_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'openclaw',
          messages: messageHistory,
          stream: true,
        }),
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let botMessage = '';
      let buffer = '';

      showLoading(false);
      const botMsg = document.createElement('div');
      botMsg.className = 'chat-message bot';
      botMsg.innerHTML = `
        <div class="message-avatar">🦞</div>
        <div class="message-bubble"></div>
      `;
      chatMessages.appendChild(botMsg);
      const bubble = botMsg.querySelector('.message-bubble');

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';

        for (const line of lines) {
          if (line.startsWith('data: ')) {
            const data = line.slice(6);
            if (data === '[DONE]') continue;
            try {
              const json = JSON.parse(data);
              const delta = json.choices?.[0]?.delta?.content;
              if (delta) {
                botMessage += delta;
                bubble.innerHTML = renderMarkdown(botMessage);
                chatMessages.scrollTop = chatMessages.scrollHeight;
              }
            } catch {}
          }
        }
      }

      messageHistory.push({ role: 'assistant', content: botMessage });
      setStatus(texts.onlineStatus);

    } catch (error) {
      showLoading(false);
      setStatus(texts.offline, true);
      console.error('Chat error:', error);
      addMessage('bot', texts.errorReply);

      setTimeout(() => setStatus(texts.onlineStatus), 5000);
    } finally {
      isLoading = false;
      chatInput.focus();
    }
  }

  chatInput.addEventListener('input', () => {
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 100) + 'px';
    chatSendBtn.disabled = !chatInput.value.trim();
  });

  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  toggleBtn.addEventListener('click', toggleChat);
  closeBtn.addEventListener('click', () => {
    exitFullscreen();
    toggleChat();
  });
  fullscreenBtn.addEventListener('click', toggleFullscreen);
  exitFullscreenBtn.addEventListener('click', () => {
    exitFullscreen();
  });
  chatSendBtn.addEventListener('click', sendMessage);

  const quickActionsEl = document.getElementById('quick-actions');
  if (quickActionsEl) {
    quickActionsEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.quick-action-btn');
      if (btn) {
        handleQuickAction(btn.dataset.action);
      }
    });
  }

  document.addEventListener('click', (e) => {
    if (isOpen && !chatPanel.contains(e.target) && !toggleBtn.contains(e.target) && !exitFullscreenBtn.contains(e.target)) {
      exitFullscreen();
      toggleChat();
    }
  });
})();

      // 暗色模式切换 — 立即执行，避免闪烁
      (function() {
        const html = document.documentElement;
        const stored = localStorage.getItem('theme');
        if (stored === 'dark') html.setAttribute('data-theme', 'dark');
        else if (stored === 'light') html.setAttribute('data-theme', 'light');

        document.addEventListener('DOMContentLoaded', function() {
          var btn = document.querySelector('.theme-toggle');
          if (!btn) return;
          btn.addEventListener('click', function() {
            var current = html.getAttribute('data-theme');
            if (current === 'dark') {
              html.setAttribute('data-theme', 'light');
              localStorage.setItem('theme', 'light');
            } else {
              html.setAttribute('data-theme', 'dark');
              localStorage.setItem('theme', 'dark');
            }
          });
        });
      })();
